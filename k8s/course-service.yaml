apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  labels:
    app: course-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      containers:
      - name: course-service
        image: basant0/course-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: RABBIT_HOST
          value: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
spec:
  type: NodePort
  selector:
    app: course-service
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30002
